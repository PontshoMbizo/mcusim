name: Deploy app

# SCAFFOLD — host not chosen yet (see scope.io plan: "Sim host = decide later").
# The deploy steps are GATED on a FLY_API_TOKEN secret, so this workflow stays
# green and no-ops until the host is picked. Fly.io is the placeholder target
# (per-run container model fits); swap in Railway/Render/VPS as needed.
#
# To activate (Fly.io path):
#   1. Add a fly.toml to the repo (flyctl launch).
#   2. Set repo secret FLY_API_TOKEN.
#   3. Ensure the host can pull the GHCR stm-sim-mainline / stm-sim-xpack images,
#      set SIM_ENGINE, and reach a rootless podman socket (SIM_PODMAN_URL) —
#      see docs/simulation-backend.md.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check host is configured
        id: guard
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "::notice::No FLY_API_TOKEN secret — deploy target not chosen yet. Skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up flyctl
        if: steps.guard.outputs.configured == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        if: steps.guard.outputs.configured == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
